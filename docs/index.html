<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mymalloc demo</title>
  <style>
    :root {
      --blue: #3b82f6;
      --cyan: #22d3ee;
      --navy: #0b1d3a;
      --black: #05070d;
      --text: #e6edf8;
      --muted: #8ea3c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--navy) 0%, var(--black) 60%, #000 100%);
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 960px;
      background: rgba(12, 22, 44, 0.75);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.5; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }
    input {
      background: #0a1426;
      color: var(--text);
      border: 1px solid #1e3358;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      width: 9rem;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
    }
    button {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #04101f;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(34, 211, 238, 0.35);
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid #1e3358;
    }
    button.ghost:hover { color: var(--text); box-shadow: none; }
    .legend {
      display: flex;
      gap: 1.25rem;
      margin: 1.75rem 0 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    #heap {
      display: flex;
      height: 110px;
      border-radius: 12px;
      overflow: hidden;
      background: #050b18;
      border: 1px solid #1e3358;
      padding: 4px;
      gap: 3px;
    }
    .block {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      animation: pop 0.35s ease-out;
    }
    .free {
      background: repeating-linear-gradient(45deg, #13305c, #13305c 8px, #0f2549 8px, #0f2549 16px);
      color: #7fb3ff;
      border: 1px dashed #2c5aa0;
    }
    .used {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #04101f;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.25);
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    .stats {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1;
      min-width: 150px;
      background: #0a1426;
      border: 1px solid #1e3358;
      border-radius: 10px;
      padding: 0.8rem 1rem;
    }
    .stat span { display: block; color: var(--muted); font-size: 0.8rem; }
    .stat strong { font-size: 1.3rem; color: var(--cyan); }
    #status {
      margin-top: 1.25rem;
      min-height: 1.5rem;
      color: var(--text);
      padding: 0.6rem 0.9rem;
      border-left: 3px solid var(--cyan);
      background: rgba(34, 211, 238, 0.06);
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>mymalloc demo</h1>
    <p class="sub">
      A JavaScript port of the C allocator. Allocate blocks, free them, and watch the heap
      split and merge on a 64 KB heap.
    </p>

    <div class="controls">
      <input id="size" type="number" min="1" placeholder="bytes">
      <button id="malloc">my_malloc</button>
      <input id="id" type="number" min="1" placeholder="block id">
      <button id="free">my_free</button>
      <button id="reset" class="ghost">Reset heap</button>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:#2c5aa0"></span>Free</span>
      <span><span class="dot" style="background:linear-gradient(135deg,#3b82f6,#22d3ee)"></span>Allocated</span>
    </div>

    <div id="heap"></div>

    <div class="stats">
      <div class="stat"><span>Free blocks</span><strong id="freeCount">0</strong></div>
      <div class="stat"><span>Allocated blocks</span><strong id="usedCount">0</strong></div>
      <div class="stat"><span>Free bytes</span><strong id="freeBytes">0</strong></div>
    </div>

    <p id="status"></p>
  </main>

  <script>
    const HEAP_SIZE = 64 * 1024;
    const HEADER = 8;
    let blocks = [];
    let nextId = 1;

    function reset() {
      blocks = [{ size: HEAP_SIZE, free: true, id: null }];
      nextId = 1;
      render("Heap reset. One large free block.");
    }

    function align8(n) { return (n + 7) & ~7; }

    function myMalloc(n) {
      const total = align8(n) + HEADER;
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        if (!b.free || b.size < total) continue;
        // Split only if the leftover can hold a header and a small payload
        if (b.size - total >= HEADER + 8) {
          blocks.splice(i + 1, 0, { size: b.size - total, free: true, id: null });
          b.size = total;
        }
        b.free = false;
        b.id = nextId++;
        return b.id;
      }
      return null;
    }

    function myFree(id) {
      const i = blocks.findIndex(b => b.id === id);
      if (i < 0) return false;
      blocks[i].free = true;
      blocks[i].id = null;
      // Merge with the next block if it is free
      if (blocks[i + 1] && blocks[i + 1].free) {
        blocks[i].size += blocks[i + 1].size;
        blocks.splice(i + 1, 1);
      }
      // Merge with the previous block if it is free
      if (i > 0 && blocks[i - 1].free) {
        blocks[i - 1].size += blocks[i].size;
        blocks.splice(i, 1);
      }
      return true;
    }

    function render(message) {
      const heap = document.getElementById("heap");
      heap.innerHTML = "";
      let freeCount = 0, usedCount = 0, freeBytes = 0;

      blocks.forEach(b => {
        const d = document.createElement("div");
        d.className = "block " + (b.free ? "free" : "used");
        d.style.flex = b.size;
        d.textContent = b.free ? `free ${b.size}` : `#${b.id} · ${b.size} B`;
        d.title = b.free ? `Free block, ${b.size} bytes` : `Block #${b.id}, ${b.size} bytes`;
        heap.appendChild(d);

        if (b.free) { freeCount++; freeBytes += b.size; } else { usedCount++; }
      });

      document.getElementById("freeCount").textContent = freeCount;
      document.getElementById("usedCount").textContent = usedCount;
      document.getElementById("freeBytes").textContent = freeBytes.toLocaleString();
      document.getElementById("status").textContent = message || "";
    }

    document.getElementById("malloc").onclick = () => {
      const n = Number(document.getElementById("size").value);
      if (!n || n < 1) return render("Enter a size in bytes.");
      const id = myMalloc(n);
      render(id ? `my_malloc(${n}) returned block #${id}.` : `No free block fits ${n} bytes.`);
    };

    document.getElementById("free").onclick = () => {
      const id = Number(document.getElementById("id").value);
      render(myFree(id) ? `my_free(#${id}) done. Free neighbours were merged.` : `No allocated block #${id}.`);
    };

    document.getElementById("reset").onclick = reset;
    reset();
  </script>
</body>
</html>
